pipeline:
  _target_: hmr4d.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
  args_denoiser3d: ${network}
  args:
    endecoder_opt: ${endecoder}
    normalize_cam_angvel: true
    pose_tokenizer_ckpt: inputs/checkpoints/tokenhmr/tokenizer.pth
    masked_pose:
      dim: 1024
      motion_depth: 4
      decoder_depth: 2
      num_heads: 8
      mlp_ratio: 4.0
      dropout: 0.0
      attn_len: 60
      mask_modes: [random, joint, frame]
      mask_mode_weights: [0.4, 0.2, 0.2]
      mask_tau: 1.0
      random_replace_prob: 0.1
      mask_replace_prob: 1.0
      generation_steps: 5
      generation_temperature: 1.0
      temp_start: 1.0
      temp_end: 0.01
      temp_end_ratio: 1.0
    weights: null
model:
  _target_: hmr4d.model.gvhmr.gvhmr_pl_demo.DemoPL
  pipeline: ${pipeline}
network:
  _target_: hmr4d.network.gvhmr.relative_transformer.NetworkEncoderRoPE
  output_dim: 25
  max_len: 120
  cliffcam_dim: 3
  cam_angvel_dim: 6
  imgseq_dim: 1024
  latent_dim: 512
  num_layers: 12
  num_heads: 8
  mlp_ratio: 4.0
  pred_cam_dim: 3
  static_conf_dim: 6
  dropout: 0.1
  avgbeta: true
endecoder:
  _target_: hmr4d.model.gvhmr.utils.endecoder.EnDecoder
  stats_name: MM_V1_AMASS_LOCAL_BEDLAM_CAM
  noise_pose_k: 10
