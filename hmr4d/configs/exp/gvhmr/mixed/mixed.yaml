# @package _global_
defaults:
    - override /data: mocap/trainX_testY
    - override /model: gvhmr/gvhmr_pl
    - override /endecoder: gvhmr/v1_amass_local_bedlam_cam
    - override /optimizer: adamw_2e-4
    - override /scheduler_cfg: epoch_half_200_350
    - override /train_datasets:
          - pure_motion_amass/v11
          - imgfeat_bedlam/v2
          - imgfeat_h36m/v1
          - imgfeat_3dpw/v1
    - override /test_datasets:
          - emdb1/v1_fliptest
          - emdb2/v1_fliptest
          - rich/all
          - 3dpw/fliptest
    - override /callbacks:
          - simple_ckpt_saver/every10e_top100
          - prog_bar/prog_reporter_every0.1
          - train_speed_timer/base
          - lr_monitor/pl
          - metric_emdb1
          - metric_emdb2
          - metric_rich
          - metric_3dpw
    - override /network: gvhmr/relative_transformer

exp_name_base: mixed
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: mocap_mixed_v1
ckpt_path: inputs/checkpoints/gvhmr/gvhmr_siga24_release.ckpt

pipeline:
    _target_: hmr4d.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
    args_denoiser3d: ${network}
    args:
        endecoder_opt: ${endecoder}
        normalize_cam_angvel: True
        pose_tokenizer_ckpt: inputs/checkpoints/tokenhmr/tokenizer.pth
        smoother:
            share_weights: true
            dim_hidden: 64
            kernel_size: 5
            num_layers: 2
        masked_pose:
            dim: 256
            motion_depth: 4
            decoder_depth: 2
            num_heads: 8
            mlp_ratio: 4.0
            dropout: 0.0
            attn_len: 60
            mask_modes: [inference, random]
            mask_mode_weights: [0.4, 0.4]
            mask_tau: 1.0
            random_replace_prob: 0.1
            mask_replace_prob: 1.0
            generation_steps: 5
            generation_temperature: 1.0
            temp_start: 1.0
            temp_end: 0.01
            temp_end_ratio: 1.0
        contact_vel_thres: 0.3
        skating_vel_thres: 0.15
        weights:
            token_ce: 1.0
            cr_j3d: 1.
            cr_verts: 10.
            j2d: 1.
            j3d_vel: 20.
            skating: 1.

data:
    loader_opts:
        train:
            batch_size: 128
            num_workers: 12

pl_trainer:
    precision: 16-mixed
    log_every_n_steps: 50
    gradient_clip_val: 0.5
    max_epochs: 500
    check_val_every_n_epoch: 10
    devices: 2

logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ${output_dir} # /save_dir/name/version/sub_dir
    name: ""
    version: "tb" # merge name and version
